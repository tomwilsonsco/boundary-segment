pipeline_settings:
  # if false, deletes the GeoTIFFs, VRT, chips, masks and dataset split after the run.
  # The run folder outputs/predictions/<run_id>/ and the model in models/ are always kept.
  preserve_intermediate_files: false

data:
  # the area name, to dynamically generate intermediate paths
  area_name: "spey"
  
  # base directory where all inputs are stored
  base_input_dir: "inputs"
  
  # path to the directory containing the APGB JPEG files
  raw_image_dir: "images/spey"
  
  # existing land parcels geometry
  parcels_gpkg: "spey_parcels.gpkg"
  
  # optional prediction mask geometry
  prediction_mask_gpkg: "spey_prediction_mask.gpkg"

models:
  # the pre-trained base model to use for initial predictions and fine-tuning
  base_model: "models/20260621_200226_boundary_base_unetplusplus.pth"
  # Name/Description to append to the locally fine-tuned model
  fine_tuned_desc: "fine_tuned"

parameters:
  assign_crs:
    crs: "EPSG:27700" # epsg for British National Grid
    
  chip_image:
    chip_size: 512
    chip_offset: 384
    resampling_factor: 0.5
    
  line_evaluate:
    # metres; the stricter buffer used to score chips for removal from training
    filter_buffer_dist: 3.0
    # metres; the business-rule buffer used for the metrics in each run's summary.json
    report_buffer_dist: 8.0
    
  filter_chips:
    min_training_length: 30
    recall_min: 0.5
    min_precision: 0.5
    
  train:
    arch: "unetplusplus"
    encoder: "efficientnet-b3"
    loss_method: "bce_dice"
    epochs: 10 # see docs/review_findings.md 2.6 before raising this
    # stop after this many epochs without validation improvement; above the LR
    # scheduler's patience (3) so a halved learning rate gets one epoch to help
    early_stop_patience: 4
    batch_size: 8
    lr: 0.00001 # 10% of LR default in train.py as fine tune